<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="images/x-icon" href="images/Colton 1.jpeg">
    <title>Quiz</title>
</head>
<body>
<form>
    <div>
        <label for="Name">Name:</label>
        <input type="text" id="Name" name="Name" placeholder="e.g., Henry/Henriette" pattern="[A-Za-z]+" title="Letters Only" required>
    </div>
<h2>Gender</h2>

    <input type="radio" id="Male" name="Gender" required>
    <label for="Male">Male</label><br>
    <input type="radio" id="Female" name="Gender" required>
    <label for="Female">Female</label><br>
    <input type="radio" id="Other" name="Gender" required>
    <label for="Other">Other</label><br>
    <input type="submit" id="submit" value="Submit">
</form>






<nav>

</nav>
</body>
</html>
